<template>
  <lightning-card title="GitHub Actions" icon-name="custom:custom63">
    <div class="slds-p-around_medium">
      <lightning-spinner
        if:true={isLoading}
        alternative-text="Loading..."
        size="medium"
      ></lightning-spinner>

      <!-- Debug Section -->
      <div class="slds-m-bottom_medium">
        <lightning-button
          label="Test Connection & List Workflows"
          icon-name="utility:search"
          variant="brand-outline"
          onclick={handleListWorkflows}
          disabled={isLoading}
          class="slds-m-bottom_small"
        >
        </lightning-button>
      </div>

      <!-- Debug Output -->
      <template if:true={showDebug}>
        <div class="slds-box slds-theme_shade slds-m-bottom_medium">
          <h3 class="slds-text-heading_small slds-m-bottom_small">
            Debug Information:
          </h3>
          <div class="debug-output">
            <pre>{debugInfo}</pre>
          </div>
          <template if:true={workflowList.length}>
            <div class="slds-m-top_small">
              <h4 class="slds-text-heading_x-small slds-m-bottom_x-small">
                Available Workflows:
              </h4>
              <template for:each={workflowList} for:item="wf">
                <div key={wf.id} class="slds-m-bottom_x-small">
                  <lightning-badge label={wf.state}></lightning-badge>
                  <span class="slds-m-left_x-small">{wf.name}</span>
                  <span class="slds-text-color_weak slds-m-left_x-small"
                    >({wf.path})</span
                  >
                </div>
              </template>
            </div>
          </template>
        </div>
      </template>

      <!-- Workflow Trigger Buttons -->
      <div class="slds-grid slds-wrap slds-gutters">
        <template for:each={workflows} for:item="workflow" for:index="index">
          <div
            key={workflow.label}
            class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3 slds-p-bottom_small"
          >
            <lightning-button
              label={workflow.label}
              icon-name={workflow.icon}
              variant={workflow.variant}
              class="slds-m-right_small full-width"
              onclick={handleTriggerWorkflow}
              data-index={index}
              disabled={isLoading}
            >
            </lightning-button>
          </div>
        </template>
      </div>
    </div>
  </lightning-card>
</template>
