<template>
  <lightning-card
    title="🚀 Salesforce Deployment Demo"
    icon-name="custom:custom63"
  >
    <div class="slds-card__body slds-card__body_inner">
      <!-- Info Banner -->
      <div class="slds-box slds-theme_info slds-m-bottom_medium">
        <p class="slds-text-body_small">
          <lightning-icon
            icon-name="utility:info"
            size="x-small"
            class="slds-m-right_x-small"
          ></lightning-icon>
          Trigger GitHub Actions workflows directly from Salesforce using
          repository dispatch events.
        </p>
      </div>

      <!-- Environment Selection -->
      <div class="slds-form-element slds-m-bottom_medium">
        <label class="slds-form-element__label">
          <abbr class="slds-required" title="required">*</abbr>
          Target Environment
        </label>
        <div class="slds-form-element__control">
          <lightning-combobox
            name="environment"
            label=""
            value={selectedEnvironment}
            placeholder="Select Environment"
            options={environmentOptions}
            onchange={handleEnvironmentChange}
            required
          ></lightning-combobox>
        </div>
      </div>

      <!-- Deploy Tests Checkbox -->
      <div class="slds-form-element slds-m-bottom_medium">
        <lightning-input
          type="checkbox"
          label="Run Apex Tests"
          checked={deployTests}
          onchange={handleDeployTestsChange}
        ></lightning-input>
      </div>

      <!-- Record ID (Optional) -->
      <div class="slds-form-element slds-m-bottom_medium">
        <lightning-input
          type="text"
          label="Record ID (Optional)"
          value={recordId}
          placeholder="Enter Salesforce Record ID"
          onchange={handleRecordIdChange}
        ></lightning-input>
      </div>

      <!-- Action Buttons -->
      <div class="slds-grid slds-gutters slds-m-top_medium">
        <div class="slds-col slds-size_1-of-2">
          <lightning-button
            variant="brand"
            label="🚀 Deploy Now"
            title="Trigger deployment workflow"
            onclick={handleDeploy}
            disabled={isDisabled}
            class="slds-m-right_x-small full-width"
          ></lightning-button>
        </div>
        <div class="slds-col slds-size_1-of-2">
          <lightning-button
            variant="neutral"
            label="📋 List Workflows"
            title="Test connection and list workflows"
            onclick={handleListWorkflows}
            disabled={isLoading}
            class="full-width"
          ></lightning-button>
        </div>
      </div>

      <!-- Loading Spinner -->
      <template if:true={isLoading}>
        <div class="slds-m-top_medium">
          <lightning-spinner
            alternative-text="Loading"
            size="small"
          ></lightning-spinner>
        </div>
      </template>

      <!-- Workflow List -->
      <template if:true={showWorkflows}>
        <div class="slds-m-top_medium">
          <div class="slds-box slds-theme_shade">
            <h3 class="slds-text-heading_small slds-m-bottom_small">
              Available Workflows ({workflowCount})
            </h3>
            <template for:each={workflows} for:item="workflow">
              <div
                key={workflow.id}
                class="workflow-item slds-p-around_x-small"
              >
                <lightning-icon
                  icon-name="utility:flow"
                  size="x-small"
                  class="slds-m-right_x-small"
                ></lightning-icon>
                <span class="slds-text-body_regular">{workflow.name}</span>
                <span class="slds-text-color_weak"> (ID: {workflow.id})</span>
              </div>
            </template>
          </div>
        </div>
      </template>

      <!-- Debug Info -->
      <template if:true={debugInfo}>
        <div class="slds-m-top_medium">
          <div class="slds-box slds-box_x-small slds-theme_default">
            <h3 class="slds-text-heading_small slds-m-bottom_x-small">
              Debug Info:
            </h3>
            <pre class="debug-text">{debugInfo}</pre>
          </div>
        </div>
      </template>

      <!-- Quick Configuration Panel -->
      <div class="slds-m-top_large slds-border_top slds-p-top_medium">
        <h3 class="slds-text-heading_small slds-m-bottom_small">
          🔧 Quick Configuration
        </h3>
        <div class="config-grid">
          <div class="config-item">
            <span class="config-label">Repository:</span>
            <span class="config-value">{repository}</span>
          </div>
          <div class="config-item">
            <span class="config-label">Workflow:</span>
            <span class="config-value">{workflowFileName}</span>
          </div>
          <div class="config-item">
            <span class="config-label">Branch:</span>
            <span class="config-value">{branch}</span>
          </div>
        </div>
      </div>
    </div>
  </lightning-card>
</template>
