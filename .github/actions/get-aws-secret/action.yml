name: "Get AWS Secret"
description: "Fetches a secret from AWS Secrets Manager and returns its value"
author: "GForce Innovation"

inputs:
  aws-region:
    description: "AWS region where the secret is stored"
    required: true
    default: "eu-central-1"
  secret-name:
    description: "Name of the secret in AWS Secrets Manager"
    required: true
  aws-role-arn:
    description: "ARN of the AWS IAM role to assume (for OIDC authentication)"
    required: true
  output-name:
    description: "Environment variable name for the secret (optional, defaults to sanitized secret name)"
    required: false
    default: ""
  parse-json:
    description: "Parse JSON secrets into individual environment variables"
    required: false
    default: "false"

outputs:
  secret-value:
    description: "The secret value retrieved from AWS Secrets Manager"
    value: ${{ steps.get-output.outputs.secret-value }}

runs:
  using: "composite"
  steps:
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ inputs.aws-role-arn }}
        aws-region: ${{ inputs.aws-region }}
        role-session-name: GitHubActions-${{ github.run_id }}

    - name: Retrieve Secret from AWS Secrets Manager
      id: get-output
      uses: aws-actions/aws-secretsmanager-get-secrets@v2
      with:
        secret-ids: |
          ${{ inputs.output-name && format('{0}, {1}', inputs.output-name, inputs.secret-name) || inputs.secret-name }}
        parse-json-secrets: ${{ inputs.parse-json }}
