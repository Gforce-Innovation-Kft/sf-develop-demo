name: Salesforce Deployment Demo
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - sandbox
          - staging
          - production
      deploy_tests:
        description: "Run Apex tests"
        required: false
        type: boolean
        default: true
      triggered_by:
        description: "Triggered by (Salesforce user)"
        required: false
        type: string
        default: "Salesforce"
      record_id:
        description: "Salesforce Record ID (optional)"
        required: false
        type: string

jobs:
  salesforce-deployment:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Display deployment info
        run: |
          echo "🚀 Salesforce Deployment Started"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Environment: ${{ inputs.environment }}"
          echo "Run Tests: ${{ inputs.deploy_tests }}"
          echo "Triggered By: ${{ inputs.triggered_by }}"
          echo "Record ID: ${{ inputs.record_id || 'N/A' }}"
          echo "Workflow: ${{ github.workflow }}"
          echo "Run Number: ${{ github.run_number }}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install Salesforce CLI
        run: |
          npm install -g @salesforce/cli
          sf --version

      - name: Authenticate to Salesforce
        env:
          SFDX_AUTH_URL: ${{ secrets.SFDX_AUTH_URL_SANDBOX }}
        run: |
          echo "Authenticating to Salesforce ${{ inputs.environment }}..."
          echo "$SFDX_AUTH_URL" > auth.txt
          sf org login sfdx-url --sfdx-url-file auth.txt --alias deployment-org
          rm auth.txt

      - name: Validate metadata (Sandbox/Staging)
        if: inputs.environment != 'production'
        run: |
          echo "🔍 Validating metadata for ${{ inputs.environment }}..."
          sf project deploy validate --target-org deployment-org

      - name: Run Apex tests
        if: inputs.deploy_tests == true
        run: |
          echo "🧪 Running Apex tests..."
          sf apex run test --target-org deployment-org --test-level RunLocalTests --wait 10 --code-coverage

      - name: Deploy to Salesforce
        run: |
          echo "📦 Deploying to ${{ inputs.environment }}..."
          sf project deploy start --target-org deployment-org --wait 20

      - name: Post-deployment verification
        run: |
          echo "✅ Deployment verification..."
          sf org display --target-org deployment-org

      - name: Deployment Summary
        if: always()
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🎯 Deployment Summary"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Status: ${{ job.status }}"
          echo "Environment: ${{ inputs.environment }}"
          echo "Triggered By: ${{ inputs.triggered_by }}"
          echo "Timestamp: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Deployment failed! Check logs above for details."
          exit 1

  notify-salesforce:
    runs-on: ubuntu-latest
    needs: salesforce-deployment
    if: always()

    steps:
      - name: Prepare notification
        run: |
          echo "Preparing to notify Salesforce about deployment result..."
          echo "Status: ${{ needs.salesforce-deployment.result }}"

      - name: Send webhook to Salesforce
        run: |
          echo "This is where we would send a webhook back to Salesforce"
          echo "with the deployment status: ${{ needs.salesforce-deployment.result }}"
