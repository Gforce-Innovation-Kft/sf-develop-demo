name: Test AWS Secrets Manager Integration

on:
  workflow_dispatch:
    inputs:
      secret-name:
        description: "Secret name to retrieve"
        required: false
        default: "salesforce/gabor-devhub"
        type: string
      aws-region:
        description: "AWS Region"
        required: false
        default: "eu-central-1"
        type: choice
        options:
          - eu-central-1
          - us-east-1
          - us-west-2
          - ap-southeast-1

env:
  DEFAULT_AWS_REGION: eu-central-1

jobs:
  test-aws-secrets:
    name: Test AWS Secrets Retrieval
    runs-on: ubuntu-latest
    timeout-minutes: 5

    # Required for AWS OIDC authentication
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4

      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli

      - name: Salesforce JWT Login
        uses: Gforce-Innovation-Kft/shared-github-actions/.github/actions/sf-jwt-login@main
        with:
          aws-region: ${{ github.event.inputs.aws-region || vars.AWS_REGION || 'eu-central-1' }}
          secret-name: ${{ github.event.inputs.secret-name || 'salesforce/gabor-devhub' }}
          aws-role-arn: ${{ vars.AWS_ROLE_ARN }}
          org-alias: gabor-devhub
          set-default-dev-hub: "true"

      - name: Check Authenticated Org

        run: |
          echo "Checking authenticated org..."
          sf org display --target-org gabor-devhub
