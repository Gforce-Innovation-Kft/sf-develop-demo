name: Test AWS Secrets Manager Integration

on:
  workflow_dispatch:
    inputs:
      secret-name:
        description: "Secret name to retrieve"
        required: false
        default: "salesforce/gabor-devhub"
        type: string
      aws-region:
        description: "AWS Region"
        required: false
        default: "eu-central-1"
        type: choice
        options:
          - eu-central-1
          - us-east-1
          - us-west-2
          - ap-southeast-1

env:
  DEFAULT_AWS_REGION: eu-central-1

jobs:
  test-aws-secrets:
    name: Test AWS Secrets Retrieval
    runs-on: ubuntu-latest
    timeout-minutes: 5

    # Required for AWS OIDC authentication
    permissions:
      id-token: write
      contents: read

    steps:
      - name: 🔄 Checkout Code
        uses: actions/checkout@v4

      - name: 📋 Display Test Context
        run: |
          cat >> $GITHUB_STEP_SUMMARY <<EOF
          ## 🧪 AWS Secrets Manager Test

          ### Configuration
          - **Triggered by:** @${{ github.actor }}
          - **AWS Region:** ${{ github.event.inputs.aws-region || vars.AWS_REGION || 'eu-central-1' }}
          - **Secret Name:** ${{ github.event.inputs.secret-name || 'salesforce/gabor-devhub' }}
          - **Role ARN:** ${{ vars.AWS_ROLE_ARN }}

          EOF

      - name: 🔐 Test Get Secret from AWS Secrets Manager
        id: get-secret
        uses: ./.github/actions/get-aws-secret
        with:
          aws-region: ${{ github.event.inputs.aws-region || vars.AWS_REGION || 'eu-central-1' }}
          secret-name: ${{ github.event.inputs.secret-name || 'salesforce/gabor-devhub' }}
          aws-role-arn: ${{ vars.AWS_ROLE_ARN }}

      - name: ✅ Verify Secret Retrieved
        run: |
          if [ -n "${{ steps.get-secret.outputs.secret-value }}" ]; then
            SECRET_LENGTH=$(echo -n "${{ steps.get-secret.outputs.secret-value }}" | wc -c | tr -d ' ')
            
            cat >> $GITHUB_STEP_SUMMARY <<EOF
          ## ✅ Test Results

          ### Success! 🎉

          ✅ Secret retrieved successfully from AWS Secrets Manager
          ✅ Secret value is present (${SECRET_LENGTH} characters)
          ✅ Secret is masked in GitHub Actions logs

          ### Secret Metadata
          - **Length:** ${SECRET_LENGTH} characters

          ---

          **✅ AWS Secrets Manager integration is working correctly!**
          EOF
            
            echo "✅ Test PASSED: Secret retrieved successfully"
            echo "✅ Secret length: ${SECRET_LENGTH} characters"
          else
            cat >> $GITHUB_STEP_SUMMARY <<EOF
          ## ❌ Test Failed

          ❌ Secret value is empty or not retrieved

          **Please check:**
          1. Secret exists in AWS Secrets Manager
          2. IAM role has correct permissions
          3. AWS region is correct
          4. Secret name matches exactly
          EOF
            
            echo "❌ Test FAILED: Secret not retrieved"
            exit 1
          fi

      - name: 🧪 Parse JSON Secret
        id: parse-json
        run: |
          SECRET_JSON='${{ steps.get-secret.outputs.secret-value }}'

          if echo "$SECRET_JSON" | jq . > /dev/null 2>&1; then
            USERNAME=$(echo "$SECRET_JSON" | jq -r '.USERNAME // empty')
            CLIENT_ID=$(echo "$SECRET_JSON" | jq -r '.CLIENT_ID // empty')
            INSTANCE_URL=$(echo "$SECRET_JSON" | jq -r '.INSTANCE_URL // empty')
            JWT_KEY=$(echo "$SECRET_JSON" | jq -r '.JWT_KEY // empty')
            
            cat >> $GITHUB_STEP_SUMMARY <<EOF
          ## 🧪 JSON Secret Parsing Test

          ✅ Secret is valid JSON

          ### Extracted Fields:

          | Field | Status | Length |
          |-------|--------|--------|
          | USERNAME | $([ -n "$USERNAME" ] && echo "✅ Present" || echo "❌ Missing") | ${#USERNAME} chars |
          | CLIENT_ID | $([ -n "$CLIENT_ID" ] && echo "✅ Present" || echo "❌ Missing") | ${#CLIENT_ID} chars |
          | INSTANCE_URL | $([ -n "$INSTANCE_URL" ] && echo "✅ Present" || echo "❌ Missing") | ${#INSTANCE_URL} chars |
          | JWT_KEY | $([ -n "$JWT_KEY" ] && echo "✅ Present" || echo "❌ Missing") | ${#JWT_KEY} chars |

          ✅ All required fields present in JSON secret

          EOF
          else
            cat >> $GITHUB_STEP_SUMMARY <<EOF
          ## 🧪 JSON Secret Parsing Test

          ❌ Secret is not valid JSON

          EOF
          fi

      - name: 🔍 Test AWS CLI Direct Access
        continue-on-error: true
        run: |
          cat >> $GITHUB_STEP_SUMMARY <<'EOF'
          ## 🔍 Direct AWS CLI Test

          ### Available Secrets
          ```
          EOF

          aws secretsmanager list-secrets \
            --region ${{ github.event.inputs.aws-region || vars.AWS_REGION || 'eu-central-1' }} \
            --query 'SecretList[?starts_with(Name, `salesforce/`)].Name' \
            --output table >> $GITHUB_STEP_SUMMARY 2>&1 || echo "Failed to list secrets" >> $GITHUB_STEP_SUMMARY

          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

      - name: 📝 Final Summary
        if: always()
        run: |
          cat >> $GITHUB_STEP_SUMMARY <<EOF
          ## 📝 Test Summary

          ### Configuration Used
          - **AWS Region:** ${{ github.event.inputs.aws-region || vars.AWS_REGION || 'eu-central-1' }}
          - **AWS Role ARN:** ${{ vars.AWS_ROLE_ARN }}
          - **Repository:** ${{ github.repository }}
          - **Run ID:** ${{ github.run_id }}

          ### Next Steps

          If all tests passed:
          ✅ Your AWS Secrets Manager integration is working correctly
          ✅ You can now use the action in your production workflows

          If tests failed:
          1. Check AWS Secrets Manager console for secret names
          2. Verify IAM role permissions
          3. Confirm GitHub repository variables are set
          4. Review CloudTrail logs for access denied errors

          📚 See documentation: \`.github/QUICKSTART_AWS_SECRETS.md\`
          EOF
