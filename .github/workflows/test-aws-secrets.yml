name: Test AWS Secrets Manager Integration

on:
  push:
  workflow_dispatch:
    inputs:
      secret-name:
        description: "Secret name to retrieve"
        required: false
        default: "salesforce/gabor-devhub"
        type: string
      aws-region:
        description: "AWS Region"
        required: false
        default: "eu-central-1"
        type: choice
        options:
          - eu-central-1
          - us-east-1
          - us-west-2
          - ap-southeast-1

env:
  DEFAULT_AWS_REGION: eu-central-1

jobs:
  test-aws-secrets:
    name: Test AWS Secrets Retrieval
    runs-on: ubuntu-latest
    timeout-minutes: 5

    # Required for AWS OIDC authentication
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4

      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli

      - name: Get Secret from AWS Secrets Manager
        uses: ./.github/actions/get-aws-secret
        with:
          aws-region: ${{ github.event.inputs.aws-region || vars.AWS_REGION || 'eu-central-1' }}
          secret-name: ${{ github.event.inputs.secret-name || 'salesforce/gabor-devhub' }}
          aws-role-arn: ${{ vars.AWS_ROLE_ARN }}

      - name: Debug Secret Values
        run: |
          echo "=== Debugging Secret Extraction ==="
          echo "Raw secret length: ${#SALESFORCE_GABOR_DEVHUB}"
          echo ""

          # Test if secret is valid JSON
          if echo "$SALESFORCE_GABOR_DEVHUB" | jq . > /dev/null 2>&1; then
            echo "✅ Secret is valid JSON"
          else
            echo "❌ Secret is NOT valid JSON"
            echo "First 100 chars: ${SALESFORCE_GABOR_DEVHUB:0:100}"
            exit 1
          fi

          # Extract and validate each field
          USERNAME=$(echo "$SALESFORCE_GABOR_DEVHUB" | jq -r '.USERNAME')
          CLIENT_ID=$(echo "$SALESFORCE_GABOR_DEVHUB" | jq -r '.CLIENT_ID')
          INSTANCE_URL=$(echo "$SALESFORCE_GABOR_DEVHUB" | jq -r '.INSTANCE_URL')         
          JWT_KEY_B64=$(echo "$SALESFORCE_GABOR_DEVHUB" | jq -r '.JWT_KEY_B64 // empty')

          echo ""
          echo "USERNAME: ${USERNAME:0:30}... (length: ${#USERNAME})"
          echo "CLIENT_ID: ${CLIENT_ID:0:30}... (length: ${#CLIENT_ID})"
          echo "INSTANCE_URL: $INSTANCE_URL"        

          echo "JWT_KEY_B64 startswith: ${JWT_KEY_B64:0:20}..."

      - name: Salesforce JWT Login
        run: |
          # Extract credentials from secret (accept plain JWT_KEY or base64 JWT_KEY_B64)
          USERNAME=$(echo "$SALESFORCE_GABOR_DEVHUB" | jq -r '.USERNAME')
          CLIENT_ID=$(echo "$SALESFORCE_GABOR_DEVHUB" | jq -r '.CLIENT_ID')
          INSTANCE_URL=$(echo "$SALESFORCE_GABOR_DEVHUB" | jq -r '.INSTANCE_URL')        
          JWT_KEY_B64=$(echo "$SALESFORCE_GABOR_DEVHUB" | jq -r '.JWT_KEY_B64 // empty')

          # Create JWT key file - accept either plain PEM or base64-encoded PEM

          # Create jwt-key.txt from either plain JWT_KEY or base64 field
          if [ -n "$JWT_KEY_B64" ]; then
            # decode base64 (ubuntu runners have openssl and base64)
            if command -v openssl >/dev/null 2>&1; then
              echo "$JWT_KEY_B64" | openssl base64 -d -A > jwt-key.txt
            else
              echo "$JWT_KEY_B64" | base64 --decode > jwt-key.txt
            fi
          else
            echo "No JWT key found in secret" >&2
            exit 1
          fi

          chmod 600 jwt-key.txt

          # Login to Salesforce
          sf org login jwt \
            --username "$USERNAME" \
            --jwt-key-file jwt-key.txt \
            --client-id "$CLIENT_ID" \
            --instance-url "$INSTANCE_URL" \
            --alias gabor-devhub \
            --set-default-dev-hub

          # Display org info
          sf org display --target-org gabor-devhub

          # Cleanup
          rm -f jwt-key.txt

      - name: Test Summary
        if: always()
        run: |
          cat >> $GITHUB_STEP_SUMMARY <<EOF
          ## Test Results

          - **Region:** ${{ github.event.inputs.aws-region || vars.AWS_REGION || 'eu-central-1' }}
          - **Secret:** ${{ github.event.inputs.secret-name || 'salesforce/gabor-devhub' }}
          - **Status:** ${{ job.status }}

          EOF
