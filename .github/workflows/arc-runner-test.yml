name: ARC Runner Test (K3s)

on:
  workflow_dispatch:

jobs:
  # ============================================================
  # Job 1 — system info + SF CLI verification
  # ============================================================
  runner-info:
    runs-on: pi5-runners
    steps:
      - name: Host info
        run: |
          echo "===== HOST ====="
          echo "Hostname:     $(hostname)"
          echo "Architecture: $(uname -m)"
          echo "OS:           $(uname -s) $(uname -r)"
          echo "CPU cores:    $(nproc)"
          echo ""
          echo "===== MEMORY ====="
          free -h
          echo ""
          echo "===== DISK ====="
          df -h /

      - name: SF CLI version
        run: sf --version

      - name: SF CLI plugins
        run: sf plugins

      - name: Node & Java versions
        run: |
          echo "Node: $(node --version)"
          echo "Java: $(java -version 2>&1 | head -1)"
          echo "jq:   $(jq --version)"

  # ============================================================
  # Job 2 — parallel runner (ARC spins up a second pod)
  # ============================================================
  parallel-job-2:
    runs-on: pi5-runners
    steps:
      - name: Host info
        run: |
          echo "===== HOST ====="
          echo "Hostname:     $(hostname)"
          echo "Architecture: $(uname -m)"
          free -h

      - name: SF CLI version
        run: sf --version

      - name: SF CLI plugins
        run: sf plugins

  # ============================================================
  # Job 3 — parallel runner (ARC spins up a third pod)
  # ============================================================
  parallel-job-3:
    runs-on: pi5-runners
    steps:
      - name: Host info
        run: |
          echo "===== HOST ====="
          echo "Hostname:     $(hostname)"
          echo "Architecture: $(uname -m)"
          free -h

      - name: SF CLI version
        run: sf --version

      - name: SF CLI plugins
        run: sf plugins

  # ============================================================
  # Summary — runs after all 3 jobs complete
  # ============================================================
  summary:
    runs-on: pi5-runners
    needs: [runner-info, parallel-job-2, parallel-job-3]
    steps:
      - name: Summary
        run: |
          echo "All 3 runners completed successfully!"
          echo "Hostname: $(hostname)"
          echo "SF CLI:   $(sf --version)"
