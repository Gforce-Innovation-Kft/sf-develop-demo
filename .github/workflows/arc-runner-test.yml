name: ARC Runner Test (K3s)

on:
  workflow_dispatch:

jobs:

  # ============================================================
  # RUNNER 1: pi5-runners (basic)
  # Default ARC image — no Docker, no SF CLI
  # Tests: shell, git, kubectl basics
  # ============================================================
  test-basic-runner:
    runs-on: pi5-runners
    steps:
      - name: Host info
        run: |
          echo "===== RUNNER: pi5-runners ====="
          echo "Hostname:     $(hostname)"
          echo "Architecture: $(uname -m)"
          echo "OS:           $(uname -s) $(uname -r)"
          echo "CPU cores:    $(nproc)"
          echo ""
          echo "===== MEMORY ====="
          free -h

      - name: Checkout
        uses: actions/checkout@v4

      - name: Git info
        run: |
          echo "Branch: $(git branch --show-current)"
          echo "Commit: $(git rev-parse --short HEAD)"

      - name: Basic tools check
        run: |
          echo "bash:  $(bash --version | head -1)"
          echo "curl:  $(curl --version | head -1)"
          echo "git:   $(git --version)"
          echo "jq:    $(jq --version)"

  # ============================================================
  # RUNNER 2: pi5-runners-dind (Docker-in-Docker)
  #
  # containerMode: dind gives you a Docker daemon accessible in
  # steps via DOCKER_HOST. It does NOT support the container:
  # job directive — that triggers k8s container hooks which need
  # RBAC permissions the dind service account doesn't have.
  #
  # Correct pattern: use docker run / docker build in steps.
  # ============================================================
  test-dind-runner:
    runs-on: pi5-runners-dind
    steps:
      - name: Host info
        run: |
          echo "===== RUNNER: pi5-runners-dind ====="
          echo "Hostname:     $(hostname)"
          echo "Architecture: $(uname -m)"
          echo "CPU cores:    $(nproc)"
          free -h

      - name: Docker daemon is reachable
        run: docker info

      - name: Docker version
        run: docker --version

      - name: Run a container via docker run
        run: docker run --rm alpine:latest sh -c "echo 'Inside alpine:' && uname -m && cat /etc/alpine-release"

      - name: Run sf-ci image via docker run
        run: |
          docker run --rm \
            gforceinnovation/sf-ci:latest \
            sf --version

  # ============================================================
  # RUNNER 3: pi5-runners-custom-sf (SF CLI pre-installed)
  # Tests: SF CLI, Node, Java, jq — no install needed
  # ============================================================
  test-custom-sf-runner:
    runs-on: pi5-runners-custom-sf
    steps:
      - name: Host info
        run: |
          echo "===== RUNNER: pi5-runners-custom-sf ====="
          echo "Hostname:     $(hostname)"
          echo "Architecture: $(uname -m)"
          free -h

      - name: SF CLI version
        run: sf --version

      - name: SF CLI plugins
        run: sf plugins

      - name: Node version
        run: node --version

      - name: Java version
        run: java -version

      - name: jq version
        run: jq --version

      - name: SF CLI help (smoke test)
        run: sf --help | head -20

  # ============================================================
  # SUMMARY — runs after all 3 pass
  # ============================================================
  summary:
    runs-on: pi5-runners
    needs: [test-basic-runner, test-dind-runner, test-custom-sf-runner]
    steps:
      - name: All runners passed
        run: |
          echo "=============================="
          echo " All 3 runner types verified!"
          echo "=============================="
          echo "  pi5-runners          ✓"
          echo "  pi5-runners-dind     ✓"
          echo "  pi5-runners-custom-sf ✓"
