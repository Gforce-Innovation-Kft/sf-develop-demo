name: ARC Runner Test (K3s)

on:
  workflow_dispatch:

jobs:
  # ============================================================
  # Job 1 — SF CLI verification
  # container: tells ARC to run steps inside sf-ci image
  # The runner pod itself uses the default ARC image
  # ============================================================
  runner-info:
    runs-on: pi5-runners
    container:
      image: gforceinnovation/sf-ci:latest
      credentials:
        username: gforceinnovation
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - name: Host info
        run: |
          echo "===== HOST ====="
          echo "Hostname:     $(hostname)"
          echo "Architecture: $(uname -m)"
          echo "CPU cores:    $(nproc)"
          free -h

      - name: SF CLI version
        run: sf --version

      - name: SF CLI plugins
        run: sf plugins

      - name: Tool versions
        run: |
          echo "Node: $(node --version)"
          java -version
          echo "jq:   $(jq --version)"

  # ============================================================
  # Job 2 — parallel runner
  # ============================================================
  parallel-job-2:
    runs-on: pi5-runners
    container:
      image: gforceinnovation/sf-ci:latest
      credentials:
        username: gforceinnovation
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - name: Host info
        run: |
          echo "Hostname: $(hostname)"
          echo "Arch:     $(uname -m)"
          free -h

      - name: SF CLI version
        run: sf --version

      - name: SF CLI plugins
        run: sf plugins

  # ============================================================
  # Job 3 — parallel runner
  # ============================================================
  parallel-job-3:
    runs-on: pi5-runners
    container:
      image: gforceinnovation/sf-ci:latest
      credentials:
        username: gforceinnovation
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - name: Host info
        run: |
          echo "Hostname: $(hostname)"
          echo "Arch:     $(uname -m)"
          free -h

      - name: SF CLI version
        run: sf --version

      - name: SF CLI plugins
        run: sf plugins

  # ============================================================
  # Summary
  # ============================================================
  summary:
    runs-on: pi5-runners
    needs: [runner-info, parallel-job-2, parallel-job-3]
    container:
      image: gforceinnovation/sf-ci:latest
      credentials:
        username: gforceinnovation
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - run: |
          echo "All 3 runners completed on K3s!"
          echo "SF CLI: $(sf --version)"
