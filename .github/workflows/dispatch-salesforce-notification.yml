name: Salesforce Notification Handler

on:
  repository_dispatch:
    types: [salesforce_event]

jobs:
  handle-salesforce-event:
    runs-on: ubuntu-latest

    steps:
      - name: Display Event Info
        run: |
          echo "🎉 Repository Dispatch Event Received!"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Event Type: ${{ github.event.action }}"
          echo "Triggered from: Salesforce"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: Dump GitHub Context
        run: |
          echo "📊 GitHub Context Information"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "👤 Actor (Who triggered):"
          echo "  Actor: ${{ github.actor }}"
          echo "  Actor ID: ${{ github.actor_id }}"
          echo "  Triggering Actor: ${{ github.triggering_actor }}"
          echo ""
          echo "🔔 Event Details:"
          echo "  Event Name: ${{ github.event_name }}"
          echo "  Event Action: ${{ github.event.action }}"
          echo "  Event Path: ${{ github.event_path }}"
          echo ""
          echo "📁 Repository Info:"
          echo "  Repository: ${{ github.repository }}"
          echo "  Repository Owner: ${{ github.repository_owner }}"
          echo "  Repository Owner ID: ${{ github.repository_owner_id }}"
          echo "  Repository ID: ${{ github.repository_id }}"
          echo ""
          echo "🌿 Branch/Ref Info:"
          echo "  Ref: ${{ github.ref }}"
          echo "  Ref Name: ${{ github.ref_name }}"
          echo "  Ref Type: ${{ github.ref_type }}"
          echo "  Default Branch: ${{ github.event.repository.default_branch }}"
          echo ""
          echo "📋 Workflow Info:"
          echo "  Workflow: ${{ github.workflow }}"
          echo "  Workflow Ref: ${{ github.workflow_ref }}"
          echo "  Workflow SHA: ${{ github.workflow_sha }}"
          echo "  Run ID: ${{ github.run_id }}"
          echo "  Run Number: ${{ github.run_number }}"
          echo "  Run Attempt: ${{ github.run_attempt }}"
          echo "  Job: ${{ github.job }}"
          echo ""
          echo "💻 Runner Info:"
          echo "  Runner OS: ${{ runner.os }}"
          echo "  Runner Arch: ${{ runner.arch }}"
          echo "  Runner Name: ${{ runner.name }}"
          echo "  Runner Temp: ${{ runner.temp }}"
          echo ""
          echo "🔐 Security Context:"
          echo "  Server URL: ${{ github.server_url }}"
          echo "  API URL: ${{ github.api_url }}"
          echo "  GraphQL URL: ${{ github.graphql_url }}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: Dump Complete Event Payload
        run: |
          echo "📦 Complete GitHub Event Payload (JSON):"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          cat ${{ github.event_path }}
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: Process Salesforce Data
        env:
          RECORD_ID: ${{ github.event.client_payload.recordId }}
          RECORD_TYPE: ${{ github.event.client_payload.recordType }}
          ACTION: ${{ github.event.client_payload.action }}
          USER_NAME: ${{ github.event.client_payload.userName }}
          MESSAGE: ${{ github.event.client_payload.message }}
        run: |
          echo "📋 Salesforce Payload:"
          echo "  Record ID: $RECORD_ID"
          echo "  Record Type: $RECORD_TYPE"
          echo "  Action: $ACTION"
          echo "  User: $USER_NAME"
          echo "  Message: $MESSAGE"

      - name: Conditional Processing
        if: ${{ github.event.client_payload.action == 'deploy' }}
        run: |
          echo "🚀 Deployment action detected!"
          echo "Would deploy to: ${{ github.event.client_payload.environment }}"

      - name: Success Notification
        run: |
          echo "✅ Event processed successfully!"
          echo "Timestamp: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
