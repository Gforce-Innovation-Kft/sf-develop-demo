name: Feature Branch Validation

on:
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'weather-app/**'
      - 'apex-common/**'
      - 'apex-mocks/**'
      - 'sfdx-project.json'
      - 'config/**'
  push:
    branches: [ feature/*, bugfix/*, hotfix/* ]
    paths:
      - 'weather-app/**'
      - 'apex-common/**'
      - 'apex-mocks/**'
      - 'sfdx-project.json'
      - 'config/**'

env:
  SCRATCH_ORG_ALIAS: pr-validation-${{ github.run_number }}
  DEV_HUB_ALIAS: devhub
  SFDX_DISABLE_DNS_CHECK: true

jobs:
  validate-feature:
    name: Validate Feature Branch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: 🔄 Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: 🛠️ Install Dependencies
        run: npm ci

      - name: 🔧 Install Salesforce CLI
        run: |
          npm install -g @salesforce/cli
          sf version

      - name: 🔑 Create JWT Key File
        run: |
          echo "${{ secrets.DEVHUB_JWT_KEY }}" > jwt-key.txt
          chmod 600 jwt-key.txt

      - name: 🏢 Authenticate to Dev Hub (JWT)
        run: |
          sf org login jwt \
            --username "${{ secrets.DEVHUB_USERNAME }}" \
            --jwt-key-file jwt-key.txt \
            --client-id "${{ secrets.DEVHUB_CLIENT_ID }}" \
            --alias ${{ env.DEV_HUB_ALIAS }} \
            --set-default-dev-hub \
            --instance-url "${{ secrets.DEVHUB_INSTANCE_URL }}"

      - name: 🧪 Create Scratch Org
        run: |
          sf org create scratch \
            --definition-file config/project-scratch-def.json \
            --alias ${{ env.SCRATCH_ORG_ALIAS }} \
            --target-dev-hub ${{ env.DEV_HUB_ALIAS }} \
            --duration-days 1 \
            --set-default \
            --wait 10 \
            --json

      - name: 📤 Deploy Source to Scratch Org
        run: |
          sf project deploy start \
            --source-dir weather-app \
            --target-org ${{ env.SCRATCH_ORG_ALIAS }} \
            --wait 20 \
            --json

      - name: 🔐 Assign Permission Set
        run: |
          sf org assign permset \
            --name Weather_Dashboard_Demo_Access \
            --target-org ${{ env.SCRATCH_ORG_ALIAS }}

      - name: 🧩 Run Apex Tests
        run: |
          sf apex run test \
            --target-org ${{ env.SCRATCH_ORG_ALIAS }} \
            --wait 10 \
            --result-format human \
            --output-dir test-results \
            --code-coverage \
            --json

      - name: 📊 Generate Test Report
        if: always()
        run: |
          if [ -f "test-results/test-result.json" ]; then
            echo "## 🧪 Test Results" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`json" >> $GITHUB_STEP_SUMMARY
            cat test-results/test-result.json | jq '.result.summary' >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          fi

      - name: 🔍 Validate Metadata
        run: |
          sf project deploy validate \
            --source-dir weather-app \
            --target-org ${{ env.SCRATCH_ORG_ALIAS }} \
            --test-level RunLocalTests \
            --json

      - name: 📋 Generate Deployment Summary
        if: always()
        run: |
          echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Scratch Org:** ${{ env.SCRATCH_ORG_ALIAS }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Weather App Components:** $(find weather-app -name '*.cls' -o -name '*.cmp' -o -name '*.js' | wc -l)" >> $GITHUB_STEP_SUMMARY

      - name: 🎯 Store Scratch Org Info
        if: success()
        run: |
          sf org display --target-org ${{ env.SCRATCH_ORG_ALIAS }} --json > scratch-org-info.json
          echo "SCRATCH_ORG_URL=$(cat scratch-org-info.json | jq -r '.result.instanceUrl')" >> $GITHUB_ENV

      - name: 💬 Comment on PR (Success)
        if: success() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const comment = `## ✅ Feature Validation Passed
            
            **Scratch Org Created Successfully!**
            - **Org Alias:** \`${{ env.SCRATCH_ORG_ALIAS }}\`
            - **Duration:** 1 day
            - **Components Deployed:** Weather Dashboard Demo
            - **Permission Set:** Weather_Dashboard_Demo_Access
            
            ### 🎯 Validation Results:
            - ✅ Scratch org creation
            - ✅ Source deployment  
            - ✅ Permission set assignment
            - ✅ Apex tests execution
            - ✅ Metadata validation
            
            ### 🌤️ Weather Dashboard Features:
            - Enterprise Patterns implementation (Domain, Service, Selector)
            - OpenWeatherMap API integration
            - Lightning Web Component interface
            - Custom Weather_Report__c object
            
            **Ready for merge!** 🚀`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      - name: 💬 Comment on PR (Failure)
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const comment = `## ❌ Feature Validation Failed
            
            **Validation Issues Detected**
            - **Branch:** \`${{ github.ref_name }}\`
            - **Commit:** \`${{ github.sha }}\`
            
            Please check the workflow logs for detailed error information and fix the issues before merging.
            
            ### 🔍 Common Issues:
            - Compilation errors in Apex classes
            - Missing dependencies or references
            - Test failures
            - Metadata deployment issues
            
            [View Workflow Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      - name: 📤 Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_number }}
          path: test-results/
          retention-days: 7

      - name: 🧹 Cleanup Scratch Org
        if: always()
        run: |
          sf org delete scratch --target-org ${{ env.SCRATCH_ORG_ALIAS }} --no-prompt || true

      - name: 🔒 Cleanup JWT Key
        if: always()
        run: |
          rm -f jwt-key.txt

  # Lint and Static Analysis
  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    
    steps:
      - name: 🔄 Checkout Code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: 🛠️ Install Dependencies
        run: npm ci

      - name: 🎨 ESLint Check
        run: npm run lint

      - name: 🔧 Prettier Check
        run: npm run prettier:check

      - name: 📊 Generate Code Quality Report
        if: always()
        run: |
          echo "## 📊 Code Quality Report" >> $GITHUB_STEP_SUMMARY
          echo "- **ESLint:** $(if npm run lint &> /dev/null; then echo '✅ Passed'; else echo '❌ Failed'; fi)" >> $GITHUB_STEP_SUMMARY
          echo "- **Prettier:** $(if npm run prettier:check &> /dev/null; then echo '✅ Passed'; else echo '❌ Failed'; fi)" >> $GITHUB_STEP_SUMMARY