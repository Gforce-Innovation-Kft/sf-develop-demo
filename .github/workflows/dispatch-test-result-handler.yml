name: Test Result Handler

on:
  repository_dispatch:
    types: [test_result]

jobs:
  handle-test-result:
    runs-on: ubuntu-latest

    steps:
      - name: Check Test Status
        run: |
          echo "Test Status: ${{ github.event.client_payload.passed }}"
          echo "Message: ${{ github.event.client_payload.message }}"
          echo "Test Suite: ${{ github.event.client_payload.testSuite }}"

      - name: Run on Failure
        if: ${{ !github.event.client_payload.passed }}
        env:
          MESSAGE: ${{ github.event.client_payload.message }}
          ERROR_DETAILS: ${{ github.event.client_payload.errorDetails }}
        run: |
          echo "❌ Tests Failed!"
          echo "Message: $MESSAGE"
          echo "Details: $ERROR_DETAILS"
          echo "Notifying team..."

      - name: Run on Success
        if: ${{ github.event.client_payload.passed }}
        run: |
          echo "✅ All Tests Passed!"
          echo "Coverage: ${{ github.event.client_payload.coverage }}%"
